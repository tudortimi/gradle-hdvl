plugins {
    id 'com.verificationgentleman.gradle.hdvl.systemverilog'
    id 'com.verificationgentleman.gradle.hdvl.svunit'
}

dependencies {
    testCompile "org.svunit:svunit:v3.34.2"
}

toolChains {
    runSVUnit {
        args '--c_arg', '-linedebug'

        // Arguments with spaces are passed through by `runSVUnit`
        args '--c_arg', '-nowarn BADPRF'

        // Workaround needed with previous plugin versions that didn't handle args with spaces correctly
        // Do not use anymore
        args '--c_arg', '"-nowarn SPDUSD"'
    }
}
