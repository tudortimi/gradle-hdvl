name: Gradle

on:
  push:
  pull_request:
    branches: [ $default-branch ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: 8
      - name: Build with Gradle
        run: ./gradlew build

  compatibility-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: 8
      - name: Determine tested Gradle versions
        id: matrix
        run: echo "matrix=$(./gradlew -q printCompatibilityMatrix)" >> "$GITHUB_OUTPUT"

  compatibility-test:
    needs: compatibility-matrix
    runs-on: ubuntu-latest
    name: compatibility (Gradle ${{ matrix.gradle }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: 8
      - name: Test against Gradle ${{ matrix.gradle }}
        run: ./gradlew ${{ matrix.task }}

  compatibility:
    needs: compatibility-test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - run: test "${{ needs.compatibility-test.result }}" = "success"
