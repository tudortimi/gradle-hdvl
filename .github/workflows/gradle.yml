name: Gradle

on:
  push:
  pull_request:
    branches: [ $default-branch ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 8
      - name: Build with Gradle
        run: ./gradlew build

  compatibility-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 8
      - name: Determine tested Gradle versions
        id: matrix
        run: echo "matrix=$(./gradlew -q printCompatibilityMatrix)" >> "$GITHUB_OUTPUT"

  compatibility-test:
    needs: compatibility-matrix
    runs-on: ubuntu-latest
    name: compatibility (Gradle ${{ matrix.gradle }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7.0.1
      # Gradle 9 requires Java 17 to run, older versions are tested on Java 8.
      # The last version listed becomes JAVA_HOME, and the toolchains pick up the others from the environment.
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: |
            17
            8
      - name: Test against Gradle ${{ matrix.gradle }}
        run: ./gradlew -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64 ${{ matrix.task }}

  compatibility:
    needs: compatibility-test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - run: test "${{ needs.compatibility-test.result }}" = "success"
