tasks.register('docs', Sync) {
    group = 'documentation'
    description = 'Builds the documentation site.'

    into layout.buildDirectory.dir('docs/site')
    from(tasks.named('asciidoctor'))
    from(tasks.named('javadoc')) { into 'api/javadoc' }
    from(tasks.named('dokkaGeneratePublicationHtml')) { into 'api/kotlin' }
}
